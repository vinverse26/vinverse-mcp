name: Deploy to ECS Express Mode

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::503947800630:role/github-actions-vinverse-mcp-deploy
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: vinverse-mcp-server
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: vinverse-mcp-server-bdbf
          image: ${{ steps.login-ecr.outputs.registry }}/vinverse-mcp-server:${{ github.sha }}
          execution-role-arn: arn:aws:iam::503947800630:role/service-role/ecsTaskExecutionRole
          infrastructure-role-arn: arn:aws:iam::503947800630:role/service-role/ecsInfrastructureRoleForExpressServices
          cluster: default
          container-port: 8001
          health-check-path: /health
          # Lets the running container itself call AWS APIs (iam/ecr/ecs/elbv2)
          # for deploy_tool.py's automation. See scripts/bootstrap_mcp_runtime_role.py.
          task-role-arn: arn:aws:iam::503947800630:role/vinverse-mcp-runtime-role
          environment-variables: |
            [
              {"name": "APPLICATION_API_URL", "value": "${{ secrets.APPLICATION_API_URL }}"},
              {"name": "INTERNAL_API_KEY", "value": "${{ secrets.INTERNAL_API_KEY }}"},
              {"name": "MCP_PORT", "value": "8001"},
              {"name": "GOOGLE_CLIENT_ID", "value": "${{ secrets.GOOGLE_CLIENT_ID }}"},
              {"name": "SESSION_SECRET", "value": "${{ secrets.SESSION_SECRET }}"},
              {"name": "ALLOWED_EMAILS", "value": "${{ secrets.ALLOWED_EMAILS }}"},
              {"name": "FRONTEND_ORIGINS", "value": "${{ secrets.FRONTEND_ORIGINS }}"},
              {"name": "GITHUB_TOKEN", "value": "${{ secrets.DEPLOY_GITHUB_TOKEN }}"},
              {"name": "DEPLOY_API_KEY", "value": "${{ secrets.DEPLOY_API_KEY }}"},
              {"name": "GITHUB_ORG", "value": "vinverse26"},
              {"name": "AWS_ACCOUNT_ID", "value": "503947800630"},
              {"name": "AWS_REGION", "value": "us-east-1"},
              {"name": "ROOT_DOMAIN", "value": "vinverse.ai"}
            ]
